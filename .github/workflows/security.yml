name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Do not add jobs.<id>.environment — Environments block Release Please bot PRs
# (ACTION_REQUIRED) and stall auto-merge. github-pages is Pages-only.

jobs:
  trivy:
    name: Trivy FS Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job name must be exactly Security Scan — branch protection requires that check context.
  security-rollup:
    name: Security Scan
    if: always()
    needs: [trivy, gitleaks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish Security Scan required check
        env:
          CONCLUDE_CONTEXT: Security Scan
          CONCLUDE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_RESULTS: |
            trivy=${{ needs.trivy.result }}
            gitleaks=${{ needs.gitleaks.result }}
        run: bash scripts/conclude-required-check.sh
