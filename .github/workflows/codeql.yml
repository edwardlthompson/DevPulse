name: CodeQL

# Matrix covers remaining stacks after prune (Python scripts + Android). JS/TS
# was dropped with examples/web and examples/node. Optional rust/go stay excluded.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

# Do not add jobs.<id>.environment — Environments block Release Please bot PRs
# (ACTION_REQUIRED) and stall auto-merge. github-pages is Pages-only.

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
    steps:
      - uses: actions/checkout@v7
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4

  # Job name must be exactly CodeQL — branch protection requires that check context.
  # GHAS also posts a neutral "CodeQL" rollup; this Actions job is the success signal.
  codeql-rollup:
    name: CodeQL
    if: always()
    needs: [analyze]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish CodeQL required check
        env:
          CONCLUDE_CONTEXT: CodeQL
          CONCLUDE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_RESULTS: |
            analyze=${{ needs.analyze.result }}
        run: bash scripts/conclude-required-check.sh
