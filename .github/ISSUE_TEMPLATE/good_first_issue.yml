name: Good first issue
description: A small, well-scoped task for a first-time contributor
title: "[good first issue]: "
labels: ["good first issue"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Keep this small enough for one PR. Questions go in SUPPORT.md. Vulnerabilities go in SECURITY.md (private), not here.
  - type: textarea
    id: why_small
    attributes:
      label: Why this is small
      description: What a first-time contributor can finish without a deep tour of the template
      placeholder: "Docs typo in START_HERE; add one sentence and run verify.sh --quick"
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Concrete files and the expected change
    validations:
      required: true
  - type: textarea
    id: validate
    attributes:
      label: How to check
      description: Command a newcomer should run
      value: "bash scripts/verify.sh"
    validations:
      required: true
