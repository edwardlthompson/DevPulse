name: Bug Report
description: Something broke — thank you for taking the time to report it
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for the report. Questions belong in SUPPORT.md. Security issues belong in SECURITY.md (private advisory), not here."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you expected versus what you saw
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Numbered steps, commands, and any log snippet (no secrets)
    validations:
      required: true
  - type: dropdown
    id: stack
    attributes:
      label: Stack
      options:
        - Web/PWA
        - Python
        - Android
        - Node
        - Lightroom
        - Template (general)
    validations:
      required: true
  - type: input
    id: template-version
    attributes:
      label: Template Version
      description: Value from .template-version
      placeholder: "0.7.1"
