name: Product idea
description: Suggest a product improvement (end users — no owner label)
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "A GitHub account is required. Template contributors who need AGENT/HUMAN owner labels should use Feature Request instead. This idea is ranked by /ideas and is not implemented until a maintainer approves a BUILD_PLAN row."
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
    validations:
      required: true
