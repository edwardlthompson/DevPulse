# Opt-in Codex PR review — NOT under .github/workflows/ (GHA will not auto-run this file).
# Enable: copy to .github/workflows/codex-review.yml and add repository secret OPENAI_API_KEY.
# Docs: docs/CODEX_REVIEW.md
#
# Codex stays read-only. Repairs happen via /prerelease → /fix (Cursor Agent), not this job.

name: Codex review (opt-in example)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  codex-review:
    runs-on: ubuntu-latest
    steps:
      - name: Require OPENAI_API_KEY
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "Missing OPENAI_API_KEY secret — aborting (example workflow)."
            echo "Add the secret, then re-run. See docs/CODEX_REVIEW.md."
            exit 1
          fi

      - name: Checkout pull request
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          fetch-depth: 0

      - name: Run Codex (read-only)
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          prompt-file: .github/codex/prompts/review.md
          output-file: codex-findings.json
          output-schema-file: .github/codex/schemas/findings.json

      - name: Render CODE_REVIEW.md artifact
        if: always()
        run: |
          set -euo pipefail
          if [ -f codex-findings.json ]; then
            python3 scripts/codex-findings-to-markdown.py \
              --input codex-findings.json \
              --output CODE_REVIEW.md \
              --source codex-ci \
              --head-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          else
            echo "No codex-findings.json produced" >&2
            exit 1
          fi

      - name: Upload CODE_REVIEW artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-code-review
          path: |
            CODE_REVIEW.md
            codex-findings.json
          if-no-files-found: warn

      - name: Post sticky PR comment
        if: github.event_name == 'pull_request' && hashFiles('CODE_REVIEW.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('CODE_REVIEW.md', 'utf8');
            const marker = '<!-- codex-review-sticky -->';
            const head = '${{ github.event.pull_request.head.sha }}';
            const full = `${marker}\n## Codex review\n\n_head.sha: \`${head}\`_\n\n${body}\n`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: full,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: full,
              });
            }
