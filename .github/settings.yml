# Desired GitHub repo settings (documentation + optional Settings GitHub App).
# Live apply on FOSS path: bash scripts/setup-github-repo.sh
# Required check *names* live in .github/required-checks.json (not a workflow content hash).
# Optional: install https://github.com/apps/settings and keep this file in sync.
# Merge queue stays off by default: docs/MERGE_QUEUE.md
repository:
  default_branch: main
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 0
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      required_status_checks:
        strict: true
        contexts:
          - CI
          - Security Scan
          - CodeQL
          - Repo Hygiene
          - Feature Gate
          - Template Upgrade Simulation (Windows)
      enforce_admins: false
      required_linear_history: false
      allow_force_pushes: false
      allow_deletions: false
